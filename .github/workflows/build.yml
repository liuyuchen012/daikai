name: Build All Platforms

on:
  workflow_dispatch:
  push:
    branches: [ main, 'v*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, 'v*' ]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  # ───────────────── Windows：AgoraInPro 桌面客户端 + Server ─────────────────
  windows:
    name: Windows · AgoraInPro + Server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publish AgoraInPro (win-x64)
        run: dotnet publish AgoraInPro/CheckIn.Client.csproj -c Release -r win-x64 --self-contained true -o publish/Client.win-x64

      - name: Publish Server (win-x64)
        run: dotnet publish Server/CheckIn.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/Server.win-x64

      - name: Upload AgoraInPro
        uses: actions/upload-artifact@v4
        with:
          name: Client.win-x64
          path: publish/Client.win-x64
          if-no-files-found: error

      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: Server.win-x64
          path: publish/Server.win-x64
          if-no-files-found: error

  # ───────────────── Linux：Server ─────────────────
  linux:
    name: Linux · Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publish Server (linux-x64)
        run: dotnet publish Server/CheckIn.Server.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish/Server.linux-x64

      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: Server.linux-x64
          path: publish/Server.linux-x64
          if-no-files-found: error

  # ───────────────── macOS：Client.Mobile (iOS) + Server ─────────────────
  macos:
    name: macOS · Client.Mobile + Server
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publish Server (osx-x64)
        run: dotnet publish Server/CheckIn.Server.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -o publish/Server.osx-x64

      - name: Publish Server (osx-arm64)
        run: dotnet publish Server/CheckIn.Server.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -o publish/Server.osx-arm64

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-maccatalyst

      - name: Build Client.Mobile (iOS device, unsigned)
        run: dotnet build Client.Mobile/AgoraIn.Client.Mobile.csproj -f net10.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false

      - name: Publish Client.Mobile (macOS Catalyst arm64, unsigned)
        run: dotnet publish Client.Mobile/AgoraIn.Client.Mobile.csproj -f net10.0-maccatalyst -c Release -p:RuntimeIdentifier=maccatalyst-arm64 -p:EnableCodeSigning=false -o publish/Mobile.macOS-arm64

      - name: Publish Client.Mobile (macOS Catalyst x64, unsigned)
        run: dotnet publish Client.Mobile/AgoraIn.Client.Mobile.csproj -f net10.0-maccatalyst -c Release -p:RuntimeIdentifier=maccatalyst-x64 -p:EnableCodeSigning=false -o publish/Mobile.macOS-x64

      - name: Upload Server osx-x64
        uses: actions/upload-artifact@v4
        with:
          name: Server.osx-x64
          path: publish/Server.osx-x64
          if-no-files-found: error

      - name: Upload Server osx-arm64
        uses: actions/upload-artifact@v4
        with:
          name: Server.osx-arm64
          path: publish/Server.osx-arm64
          if-no-files-found: error

      - name: Upload iOS app (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: Mobile.iOS-unsigned
          path: Client.Mobile/bin/Release/net10.0-ios/ios-arm64
          if-no-files-found: warn

      - name: Upload macOS app (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: Mobile.macOS
          path: publish/Mobile.macOS-arm64
          if-no-files-found: error

  # ───────────────── Android：Client.Mobile ─────────────────
  android:
    name: Android · Client.Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Write Android keystore (from secrets)
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/android.keystore"
            echo "KEYSTORE_READY=true" >> "$GITHUB_ENV"
            echo "Keystore ready."
          else
            echo "No keystore secret configured, building unsigned."
          fi

      - name: Publish Android APK/AAB
        shell: bash
        run: |
          ARGS="-c Release -f net10.0-android -p:AndroidPackageFormats=apk%3Baab -o publish/Mobile.Android"
          if [ "$KEYSTORE_READY" = "true" ]; then
            ARGS="$ARGS -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/android.keystore -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }} -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          fi
          dotnet publish Client.Mobile/AgoraIn.Client.Mobile.csproj $ARGS

      - name: Verify 16 KB page size (zip alignment)
        shell: bash
        run: |
          APK=$(find publish/Mobile.Android -name "*.apk" | head -1)
          ZIPALIGN=$(ls "$ANDROID_HOME/build-tools/"*/zipalign | sort -V | tail -1)
          echo "Checking $APK with $ZIPALIGN (16 KB)"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" && echo "16KB OK" || echo "Warning: APK not 16 KB aligned (verify in Play Console)"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mobile.Android
          path: publish/Mobile.Android
          if-no-files-found: error

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 820" width="100%" height="100%">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="12" flood-opacity="0.25"/></filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="100%" stop-color="#5a9cff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1420" height="820" rx="12" fill="white" filter="url(#shadow)"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="1420" height="48" rx="12" fill="url(#header)"/>
  <rect x="0" y="24" width="1420" height="24" fill="url(#header)"/>

  <!-- Title bar content -->
  <circle cx="24" cy="24" r="6" fill="white" opacity="0.9"/>
  <text x="40" y="28" fill="white" font-size="14" font-weight="bold" font-family="Segoe UI">打卡系统</text>

  <!-- Menu items -->
  <text x="120" y="28" fill="white" font-size="13" font-family="Segoe UI" opacity="0.9">文件</text>
  <text x="170" y="28" fill="white" font-size="13" font-family="Segoe UI" opacity="0.9">远程</text>
  <text x="220" y="28" fill="white" font-size="13" font-family="Segoe UI" opacity="0.9">设置</text>
  <text x="270" y="28" fill="white" font-size="13" font-family="Segoe UI" opacity="0.9">帮助</text>

  <!-- Window controls -->
  <text x="1390" y="28" fill="white" font-size="14" font-family="Segoe UI" opacity="0.9">✕</text>
  <text x="1370" y="28" fill="white" font-size="14" font-family="Segoe UI" opacity="0.9">☐</text>
  <text x="1350" y="28" fill="white" font-size="14" font-family="Segoe UI" opacity="0.9">─</text>

  <!-- Left Panel - Ranking -->
  <rect x="20" y="65" width="300" height="690" rx="8" fill="#f8f9fa"/>
  <text x="36" y="92" fill="#333" font-size="16" font-weight="bold" font-family="Segoe UI">打卡排名</text>
  <text x="36" y="110" fill="#888" font-size="12" font-family="Segoe UI">最早打卡</text>

  <!-- Rank items -->
  <g font-family="Segoe UI">
    <!-- 1st -->
    <text x="36" y="140" fill="#FFD700" font-size="14" font-weight="bold">1</text>
    <text x="60" y="140" fill="#333" font-size="13">张三</text>
    <text x="250" y="140" fill="#888" font-size="12">07:58</text>

    <!-- 2nd -->
    <text x="36" y="168" fill="#C0C0C0" font-size="14" font-weight="bold">2</text>
    <text x="60" y="168" fill="#333" font-size="13">李四</text>
    <text x="250" y="168" fill="#888" font-size="12">08:02</text>

    <!-- 3rd -->
    <text x="36" y="196" fill="#CD7F32" font-size="14" font-weight="bold">3</text>
    <text x="60" y="196" fill="#333" font-size="13">王五</text>
    <text x="250" y="196" fill="#888" font-size="12">08:05</text>

    <text x="36" y="224" fill="#333" font-size="14">4</text>
    <text x="60" y="224" fill="#333" font-size="13">赵六</text>
    <text x="250" y="224" fill="#888" font-size="12">08:10</text>
  </g>

  <!-- Right Panel Content -->
  <!-- Status bar -->
  <text x="336" y="90" fill="#666" font-size="13" font-family="Segoe UI">就绪</text>
  <circle cx="1370" cy="87" r="4" fill="#34a853"/>
  <text x="1380" y="92" fill="#777" font-size="12" font-family="Segoe UI">在线</text>

  <!-- Stats bar -->
  <rect x="336" y="105" width="1064" height="38" rx="8" fill="#e8f0fe"/>
  <text x="350" y="130" fill="#4285f4" font-size="14" font-weight="bold" font-family="Segoe UI">总人数: 40  |  已打卡: 12  (30.0%)</text>

  <!-- Student Buttons Grid -->
  <!-- Row 1 - checked-in students (blue) -->
  <rect x="336" y="160" width="165" height="52" rx="8" fill="#4285f4"/>
  <text x="418" y="192" fill="white" font-size="15" font-weight="bold" font-family="Segoe UI" text-anchor="middle">张三</text>

  <rect x="509" y="160" width="165" height="52" rx="8" fill="#4285f4"/>
  <text x="591" y="192" fill="white" font-size="15" font-weight="bold" font-family="Segoe UI" text-anchor="middle">李四</text>

  <rect x="682" y="160" width="165" height="52" rx="8" fill="#4285f4"/>
  <text x="764" y="192" fill="white" font-size="15" font-weight="bold" font-family="Segoe UI" text-anchor="middle">王五</text>

  <rect x="855" y="160" width="165" height="52" rx="8" fill="#4285f4"/>
  <text x="937" y="192" fill="white" font-size="15" font-weight="bold" font-family="Segoe UI" text-anchor="middle">赵六</text>

  <rect x="1028" y="160" width="165" height="52" rx="8" fill="#4285f4"/>
  <text x="1110" y="192" fill="white" font-size="15" font-weight="bold" font-family="Segoe UI" text-anchor="middle">陈七</text>

  <rect x="1201" y="160" width="165" height="52" rx="8" fill="#4285f4"/>
  <text x="1283" y="192" fill="white" font-size="15" font-weight="bold" font-family="Segoe UI" text-anchor="middle">刘八</text>

  <!-- Remaining rows - unchecked (grey) -->
  <g>
    <rect x="336" y="220" width="165" height="52" rx="8" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
    <text x="418" y="252" fill="#555" font-size="14" font-family="Segoe UI" text-anchor="middle">学生9</text>
    <rect x="509" y="220" width="165" height="52" rx="8" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
    <text x="591" y="252" fill="#555" font-size="14" font-family="Segoe UI" text-anchor="middle">学生10</text>
    <rect x="682" y="220" width="165" height="52" rx="8" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
    <text x="764" y="252" fill="#555" font-size="14" font-family="Segoe UI" text-anchor="middle">学生11</text>
    <rect x="855" y="220" width="165" height="52" rx="8" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
    <text x="937" y="252" fill="#555" font-size="14" font-family="Segoe UI" text-anchor="middle">学生12</text>
    <rect x="1028" y="220" width="165" height="52" rx="8" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
    <text x="1110" y="252" fill="#555" font-size="14" font-family="Segoe UI" text-anchor="middle">学生13</text>
    <rect x="1201" y="220" width="165" height="52" rx="8" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
    <text x="1283" y="252" fill="#555" font-size="14" font-family="Segoe UI" text-anchor="middle">学生14</text>

    <!-- Row 3 -->
    <rect x="336" y="280" width="165" height="52" rx="8" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
    <text x="418" y="312" fill="#555" font-size="14" font-family="Segoe UI" text-anchor="middle">学生15</text>
    <rect x="509" y="280" width="165" height="52" rx="8" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
    <text x="591" y="312" fill="#555" font-size="14" font-family="Segoe UI" text-anchor="middle">学生16</text>
    <rect x="682" y="280" width="165" height="52" rx="8" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
    <text x="764" y="312" fill="#555" font-size="14" font-family="Segoe UI" text-anchor="middle">学生17</text>
    <rect x="855" y="280" width="165" height="52" rx="8" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
    <text x="937" y="312" fill="#555" font-size="14" font-family="Segoe UI" text-anchor="middle">学生18</text>
    <rect x="1028" y="280" width="165" height="52" rx="8" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
    <text x="1110" y="312" fill="#555" font-size="14" font-family="Segoe UI" text-anchor="middle">学生19</text>
    <rect x="1201" y="280" width="165" height="52" rx="8" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
    <text x="1283" y="312" fill="#555" font-size="14" font-family="Segoe UI" text-anchor="middle">学生20</text>
  </g>

  <!-- Status Bar -->
  <rect x="0" y="790" width="1420" height="30" rx="0" fill="#f5f5f5"/>
  <text x="16" y="808" fill="#888" font-size="11" font-family="Segoe UI">就绪</text>
  <text x="1360" y="808" fill="#aaa" font-size="11" font-family="Segoe UI">右键点击已打卡学生可取消打卡</text>
</svg>

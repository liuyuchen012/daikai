  <rect x="8" y="124" width="184" height="28" fill="transparent" rx="4"/>
  <text x="32" y="142" fill="#444" font-size="13" font-family="Segoe UI">🗎 英语打卡</text>
  <rect x="152" y="126" width="36" height="18" rx="9" fill="#34a853"/>
  <text x="158" y="139" fill="white" font-size="9" font-family="Segoe UI">在线</text>

  <rect x="8" y="156" width="184" height="28" fill="transparent" rx="4"/>
  <text x="32" y="174" fill="#444" font-size="13" font-family="Segoe UI">🗎 语文打卡</text>

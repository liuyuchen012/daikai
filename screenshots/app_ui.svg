<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1530 850" width="100%" height="100%">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="24" flood-opacity="0.3"/></filter>
    <filter id="card-shadow"><feDropShadow dx="0" dy="1" stdDeviation="4" flood-opacity="0.15"/></filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="100%" stop-color="#5a9cff"/>
    </linearGradient>
  </defs>

  <!-- Window outer border with shadow -->

  <rect x="8" y="56" width="184" height="32" fill="#e8e8e8" rx="4"/>
  <text x="24" y="76" fill="#666" font-size="13" font-family="Segoe UI" font-weight="SemiBold">🖿 辅导班（授课）</text>

